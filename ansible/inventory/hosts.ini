# Fill ansible_host from Terraform:
#   cd infra/envs/<env> && terraform output -raw public_ip

[test]
wp-test ansible_host=TEST_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[production]
wp-prod ansible_host=PROD_EC2_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[wordpress:children]
test
production
