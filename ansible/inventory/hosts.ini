# LOCAL RUNS ONLY. The GitLab deploy jobs do not read this file — they resolve
# the instance by its Name tag (tt-wp-<env>) and write their own inventory to
# /tmp/inventory.ini, so editing this has no effect on a pipeline.
#
# Fill ansible_host from Terraform:
#   cd infra/envs/<env> && terraform output -raw public_ip

[test]
wp-test ansible_host=TEST_EC2_PUBLIC_IP ansible_user=admin ansible_ssh_private_key_file=~/.ssh/your-key.pem

[production]
wp-prod ansible_host=PROD_EC2_PUBLIC_IP ansible_user=admin ansible_ssh_private_key_file=~/.ssh/your-key.pem

[wordpress:children]
test
production
