[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
# `stdout_callback = yaml` used to mean community.general.yaml, which that
# collection REMOVED in 12.0.0. requirements.yml pins no versions, so the next
# runner-image build pulls a version without it and every ansible job dies at
# startup with "callback plugin has been removed" — before a single task runs.
# This is the supported replacement since ansible-core 2.13 and renders
# identically.
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
