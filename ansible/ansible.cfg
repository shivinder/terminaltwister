[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
# `stdout_callback = yaml` used to mean community.general.yaml, which that
# collection REMOVED in 12.0.0: a runner-image build that pulled 12.x killed
# every ansible job at startup with "callback plugin has been removed", before a
# single task ran. The default callback with callback_result_format = yaml is
# the supported replacement (ansible-core 2.13+). Mind the key name: a bare
# `result_format` is not a setting, and Ansible ignores it without a word,
# leaving the output as JSON.
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
pipelining = True
