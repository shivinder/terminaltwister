---
# All tasks are skipped when enable_tls is false
# (e.g., TLS terminated at an ALB or CloudFront instead).

# Validation is DNS-01 through Route53: certbot proves control of each name by
# publishing a TXT record at _acme-challenge.<name>, using the instance role
# (certificate_names in infra/envs/<env>/main.tf, policy in
# infra/modules/wordpress/iam.tf). Let's Encrypt never connects to this host, so
# issuance does not depend on the A record, on port 80, or on a stale AAAA —
# the certificate can exist before DNS points here.
#
# The names below and certificate_names must agree. If Terraform grants fewer,
# certbot fails with an AccessDenied on route53:ChangeResourceRecordSets.

- name: Install certbot and its Route53 plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-route53
    state: present
  when: enable_tls

- name: Obtain Let's Encrypt certificate (DNS-01 via Route53)
  ansible.builtin.command: >
    certbot certonly --dns-route53
    -d {{ domain }}{{ ' -d www.' + domain if www_alias else '' }}
    --expand --non-interactive --agree-tos -m {{ admin_email }}
  args:
    creates: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
  when: enable_tls

# A certificate that already exists — issued before this role used DNS-01, or
# restored from a config backup taken then — keeps renewing the way it was
# issued: over HTTP, through a vhost that no longer serves the challenge. That
# would go unnoticed until the renewal timer started failing weeks later.
# rc 0 = already Route53, 1 = something else, 2 = no renewal file to read.
- name: Check how the certificate renews
  ansible.builtin.command: >
    grep -qx 'authenticator = dns-route53'
    /etc/letsencrypt/renewal/{{ domain }}.conf
  register: tls_renewal
  failed_when: tls_renewal.rc > 1
  changed_when: false
  when: enable_tls

# reconfigure rehearses a renewal with the new settings against Let's Encrypt's
# staging service and saves them only if it passes, so a missing permission
# fails here rather than at the next real renewal.
- name: Switch an existing certificate's renewals to Route53
  ansible.builtin.command: >
    certbot reconfigure --cert-name {{ domain }} --dns-route53 --non-interactive
  changed_when: true
  when:
    - enable_tls
    - tls_renewal.rc == 1

- name: Install renewal deploy hook to reload nginx
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx
  when: enable_tls

- name: Re-render vhost with TLS + HTTPS redirect
  ansible.builtin.include_role:
    name: wordpress
    tasks_from: vhost
  when: enable_tls
