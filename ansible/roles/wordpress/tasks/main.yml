---
- name: Install WP-CLI
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: /usr/local/bin/wp
    mode: "0755"

- name: Create web root
  ansible.builtin.file:
    path: "{{ wp_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Download WordPress core
  ansible.builtin.command: wp core download --path={{ wp_root }} --locale={{ wp_locale }}
  args:
    creates: "{{ wp_root }}/wp-settings.php"
  become_user: www-data

- name: Check whether wp-config.php exists
  ansible.builtin.stat:
    path: "{{ wp_root }}/wp-config.php"
  register: wp_config

- name: Fetch fresh salts from the WordPress API
  ansible.builtin.uri:
    url: https://api.wordpress.org/secret-key/1.1/salt/
    return_content: true
  register: wp_salts
  when: not wp_config.stat.exists

- name: Deploy wp-config.php (once — salts are not rotated on re-runs)
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wp_root }}/wp-config.php"
    owner: www-data
    group: www-data
    mode: "0640"
  when: not wp_config.stat.exists

- name: Set directory permissions to 755
  ansible.builtin.command: find {{ wp_root }} -type d -exec chmod 755 {} +
  changed_when: false

- name: Set file permissions to 644
  ansible.builtin.command: find {{ wp_root }} -type f -exec chmod 644 {} +
  changed_when: false

- name: Restrict wp-config.php to 640
  ansible.builtin.file:
    path: "{{ wp_root }}/wp-config.php"
    mode: "0640"
    owner: www-data
    group: www-data

# --- nginx vhost (also re-used by the tls role via tasks_from: vhost) ---
- name: Render nginx vhost
  ansible.builtin.import_tasks: vhost.yml

- name: Flush handlers so nginx is live before the install check
  ansible.builtin.meta: flush_handlers

# The headless install lives in the wp_install role, which runs after tls.
# wp core install records the site's own URL and nothing revisits it, so it must
# not run until a certificate exists — see roles/wp_install/README.md.
