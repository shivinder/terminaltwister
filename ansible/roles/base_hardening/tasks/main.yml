---
- name: Update apt cache and dist-upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: dist

# The last three are here because Debian's cloud image is leaner than most:
# none of them is preinstalled, and nothing else this play installs pulls
# them in.
#
#   nftables  - Debian's fail2ban bans through `nft` by default, but only
#               recommends `nftables | iptables`, and the image already has
#               iptables. Without the binary every ban fails, and the only
#               sign of it is a line in fail2ban's own log.
#   logrotate - nginx, fail2ban and the backup script all ship rotation
#               rules; without this nothing ever acts on them.
#   acl       - lets Ansible become www-data when pipelining is off, which
#               is what a run that misses ansible.cfg gets.
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - ufw
      - fail2ban
      - curl
      - unzip
      - git
      - python3-pymysql
      - nftables
      - logrotate
      - acl
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Create admin system user
  ansible.builtin.user:
    name: "{{ system_user }}"
    groups: sudo
    append: true
    shell: /bin/bash

- name: Install SSH public key for admin user
  ansible.posix.authorized_key:
    user: "{{ system_user }}"
    key: "{{ system_user_ssh_key }}"

- name: Allow passwordless sudo for admin user
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-{{ system_user }}
    mode: "0440"
    validate: visudo -cf %s
    content: "{{ system_user }} ALL=(ALL) NOPASSWD:ALL\n"
  when: system_user_nopasswd_sudo

- name: Harden SSH daemon
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: sshd -t -f %s
  loop:
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
    - { regexp: "^#?KbdInteractiveAuthentication", line: "KbdInteractiveAuthentication no" }
    - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
    - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
  notify: Restart sshd

- name: Allow SSH, HTTP, HTTPS through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ ssh_port }}"
    - "80"
    - "443"

- name: Enable ufw with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Configure fail2ban sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
